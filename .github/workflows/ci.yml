name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious -D clippy::complexity -D clippy::perf -D clippy::style -A clippy::approx_constant -A clippy::needless_range_loop -A clippy::too_many_arguments -A clippy::unnecessary_wraps -A clippy::suboptimal_flops
        env:
          RUSTFLAGS: ""
          CARGO_BUILD_WARNINGS: warn
      - run: cargo doc --all-features --no-deps

  test:
    name: Test Suite
    needs: quality
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  msrv:
    name: Minimum Rust Version
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      # Tests and benchmarks use stable; their dependencies require newer Rust.
      - run: cargo check --lib --all-features
      - run: cargo check --lib --no-default-features --features libm,chrono,alloc

  features:
    name: Feature Combinations
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [std, libm, 'std,chrono', 'libm,chrono', 'libm,alloc', 'libm,chrono,alloc']
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --features '${{ matrix.features }}'
