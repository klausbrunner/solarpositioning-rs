name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.6.0 (without v)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (do not publish or push)'
        required: true
        default: true
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check release version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter a release version such as 0.6.0, without a v prefix."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and test
        run: |
          cargo fmt -- --check
          cargo test --all-features
          cargo test --doc
          cargo test --no-default-features --features libm

      - name: Release with cargo-release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo release "$RELEASE_VERSION" --no-confirm
          else
            if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
              echo "::error::Set the CARGO_REGISTRY_TOKEN repository secret before publishing."
              exit 1
            fi
            cargo release "$RELEASE_VERSION" --execute --no-confirm
          fi
